name: noor_alarm
description: Smart alarm with prayer times, Hijri calendar and Islamic ringtones.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  alarm: ^5.14.0
  shared_preferences: ^2.5.5
  hijri: ^3.0.1
  adhan_dart: ^2.0.1
  geolocator: ^14.1.1
  permission_handler: ^13.0.2
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
